<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Playground</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Interactive Playground 🎪</h1>
    </header>

    <!-- Event Handling Section -->
    <section class="card">
        <h2>Event Handling 🎈</h2>
        <button id="colorChanger" class="rainbow-hover">Click Me! 🌈</button>
        <div id="hoverZone" class="hover-box">Hover Over Me! ✨</div>
        <p></p>
        <input type="text" id="keyInput" placeholder="Type 'secret' 👀">
        <div id="secretMessage" class="hidden">🎉 You found the secret!</div>
    </section>

    <!-- Image Gallery -->
    <section class="card">
        <h2>Image Gallery 🖼️</h2>
        <div class="gallery-container">
            <img src="https://picsum.photos/400/300?random=1" alt="Gallery image" id="galleryImage">
            <div class="gallery-controls">
                <button id="prevBtn">← Previous</button>
                <button id="nextBtn">Next →</button>
            </div>
        </div>
    </section>

    <!-- Tabs Section -->
    <section class="card">
        <div class="tabs">
            <button class="tab active" data-tab="1">Tab 1</button>
            <button class="tab" data-tab="2">Tab 2</button>
            <button class="tab" data-tab="3">Tab 3</button>
        </div>
        <div class="tab-content show" data-tab="1">Content for Tab 1 📍</div>
        <div class="tab-content" data-tab="2">Content for Tab 2 📍</div>
        <div class="tab-content" data-tab="3">Content for Tab 3 📍</div>
    </section>

    <!-- Form Validation -->
    <section class="card">
        <h2>Sign Up Form 📋</h2>
        <form id="signupForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
                <div class="error" id="usernameError"></div>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email" required>
                <div class="error" id="emailError"></div>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
                <div class="error" id="passwordError"></div>
            </div>
            <button type="submit">Register 🚀</button>
        </form>
    </section>

    <!-- Secret Modal -->
    <div id="secretModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <p>🎉 You found the double-click secret!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
